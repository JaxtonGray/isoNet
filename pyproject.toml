[project]
name = "isonet"
version = "0.1.0"
description = ""
authors = [
    {name = "JaxtonGray",email = "jaxtongray@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "xarray (>=2026.7.0,<2027.0.0)",
    "geopandas (>=1.1.4,<2.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "scipy (>=1.18.0,<2.0.0)",
    "rasterio (>=1.5.0,<2.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "keras (>=3.15.1,<4.0.0)",
    "tensorflow (>=2.21.0,<3.0.0)"
]

[tool.poetry]
packages = [{include = "isonet", from = "src"}]


[tool.poetry.group.dev.dependencies]
ipykernel = "^7.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
